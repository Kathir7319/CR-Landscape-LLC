<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="twilightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2a47"/>
      <stop offset="60%" stop-color="#364968"/>
      <stop offset="100%" stop-color="#69768a"/>
    </linearGradient>
    <linearGradient id="paverStone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#918d86"/>
      <stop offset="50%" stop-color="#b0aba3"/>
      <stop offset="100%" stop-color="#7d7870"/>
    </linearGradient>
    <linearGradient id="fireGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9d00"/>
      <stop offset="50%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#b32400"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe89e" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ffb732" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff9e00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dramatic Twilight Evening Sky -->
  <rect width="1200" height="300" fill="url(#twilightSky)"/>

  <!-- Sculpted Evergreen Arborvitae Privacy Hedge -->
  <g fill="#122b1c">
    <ellipse cx="80" cy="280" rx="45" ry="90"/>
    <ellipse cx="160" cy="275" rx="45" ry="95"/>
    <ellipse cx="240" cy="280" rx="45" ry="90"/>
    <ellipse cx="320" cy="285" rx="40" ry="85"/>
    <ellipse cx="880" cy="280" rx="45" ry="90"/>
    <ellipse cx="960" cy="275" rx="45" ry="95"/>
    <ellipse cx="1040" cy="280" rx="45" ry="90"/>
    <ellipse cx="1120" cy="285" rx="40" ry="85"/>
  </g>

  <!-- Engineered Belgard Segmental Retaining Wall (Tiered Stone Structure) -->
  <g fill="#575249" stroke="#33302b" stroke-width="2">
    <rect x="0" y="300" width="1200" height="35"/>
    <rect x="0" y="335" width="1200" height="35"/>
    <rect x="0" y="370" width="1200" height="35"/>
    <!-- Coping Cap Unit -->
    <rect x="0" y="280" width="1200" height="20" fill="#756f64"/>
  </g>

  <!-- Interlocking Modular Natural Stone Paver Patio Surface -->
  <polygon points="0,400 1200,400 1200,800 0,800" fill="url(#paverStone)"/>

  <!-- Joint Lines & Paver Geometry (Herringbone / Multi-Piece Ashlar Pattern) -->
  <g stroke="#4f4a43" stroke-width="3" opacity="0.6">
    <!-- Horizontal Course Lines with Perspective -->
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="490" x2="1200" y2="490"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
    <line x1="0" y1="620" x2="1200" y2="620"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>

    <!-- Modular Segment Breaks -->
    <line x1="150" y1="400" x2="150" y2="440"/>
    <line x1="380" y1="400" x2="380" y2="440"/>
    <line x1="620" y1="400" x2="620" y2="440"/>
    <line x1="880" y1="400" x2="880" y2="440"/>

    <line x1="80" y1="440" x2="80" y2="490"/>
    <line x1="280" y1="440" x2="280" y2="490"/>
    <line x1="520" y1="440" x2="520" y2="490"/>
    <line x1="760" y1="440" x2="760" y2="490"/>
    <line x1="1020" y1="440" x2="1020" y2="490"/>

    <line x1="200" y1="490" x2="200" y2="550"/>
    <line x1="450" y1="490" x2="450" y2="550"/>
    <line x1="750" y1="490" x2="750" y2="550"/>
    <line x1="1050" y1="490" x2="1050" y2="550"/>

    <line x1="120" y1="550" x2="120" y2="620"/>
    <line x1="390" y1="550" x2="390" y2="620"/>
    <line x1="810" y1="550" x2="810" y2="620"/>
    <line x1="1090" y1="550" x2="1090" y2="620"/>
  </g>

  <!-- Central Architectural Circular Stone Fire Pit -->
  <g>
    <!-- Outer Stone Ring -->
    <ellipse cx="600" cy="580" rx="190" ry="75" fill="#3b3731" stroke="#211f1c" stroke-width="6"/>
    <ellipse cx="600" cy="570" rx="160" ry="60" fill="#24221f"/>
    <!-- Lava Rock Bed -->
    <ellipse cx="600" cy="565" rx="130" ry="45" fill="#141312"/>

    <!-- Radiant Fire Feature Glow -->
    <circle cx="600" cy="550" r="140" fill="url(#lampGlow)" opacity="0.6"/>

    <!-- Dancing Flame Elements -->
    <path d="M 540,560 Q 560,490 580,440 Q 600,500 620,430 Q 640,480 660,560 Z" fill="url(#fireGlow)"/>
    <path d="M 570,555 Q 590,470 600,420 Q 610,470 630,555 Z" fill="#ffd426"/>
  </g>

  <!-- Brass Low-Voltage Architectural Landscape Path Lights (Warm 2700K Glow) -->
  <!-- Light Left -->
  <circle cx="180" cy="480" r="110" fill="url(#lampGlow)"/>
  <rect x="177" y="440" width="6" height="45" fill="#a17a2d"/>
  <polygon points="165,440 195,440 180,430" fill="#694d17"/>

  <!-- Light Right -->
  <circle cx="1020" cy="480" r="110" fill="url(#lampGlow)"/>
  <rect x="1017" y="440" width="6" height="45" fill="#a17a2d"/>
  <polygon points="1005,440 1035,440 1020,430" fill="#694d17"/>
</svg>
