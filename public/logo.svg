<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#092415"/>
      <stop offset="50%" stop-color="#144329"/>
      <stop offset="100%" stop-color="#06190e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf0cd"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa820a"/>
      <stop offset="100%" stop-color="#f5e1a4"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d7a4b"/>
      <stop offset="50%" stop-color="#40916c"/>
      <stop offset="100%" stop-color="#78f000"/>
    </linearGradient>
    <linearGradient id="stripeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78f000" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1b4d2e" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Luxury Hex-Shield Contour -->
  <path d="M 250,25 
           L 435,95 
           L 435,280 
           C 435,385 345,455 250,485 
           C 155,455 65,385 65,280 
           L 65,95 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#goldGlow)"/>

  <!-- Inner Inset Border -->
  <path d="M 250,48 
           L 415,110 
           L 415,275 
           C 415,368 335,432 250,460 
           C 165,432 85,368 85,275 
           L 85,110 Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="3" 
        stroke-opacity="0.65"
        stroke-dasharray="10 6"/>

  <!-- Manicured Turf Mowing Stripes (Lawn Geometry) -->
  <g opacity="0.25">
    <path d="M 140,290 L 175,290 L 195,440 L 160,440 Z" fill="url(#stripeGrad)"/>
    <path d="M 195,270 L 230,270 L 245,455 L 210,455 Z" fill="url(#stripeGrad)"/>
    <path d="M 250,260 L 285,260 L 285,455 L 250,455 Z" fill="url(#stripeGrad)"/>
    <path d="M 305,270 L 340,270 L 325,445 L 290,445 Z" fill="url(#stripeGrad)"/>
  </g>

  <!-- Monogram C & R with Leaf Motif -->
  <!-- Interlocking Letter C -->
  <path d="M 220,150 
           C 160,150 130,190 130,250 
           C 130,310 160,350 220,350 
           C 245,350 265,340 275,330 
           L 260,300 
           C 250,308 238,314 220,314 
           C 182,314 165,285 165,250 
           C 165,215 182,186 220,186 
           C 240,186 252,192 262,202 
           L 280,172 
           C 265,158 245,150 220,150 Z" 
        fill="url(#goldGrad)"/>

  <!-- Interlocking Letter R with Botanical Leaf Terminal -->
  <path d="M 265,155 
           L 330,155 
           C 365,155 385,175 385,208 
           C 385,232 372,250 350,258 
           L 392,348 
           L 355,348 
           L 318,265 
           L 298,265 
           L 298,348 
           L 265,348 Z
           M 298,185 
           L 298,235 
           L 326,235 
           C 342,235 352,226 352,210 
           C 352,194 342,185 326,185 Z" 
        fill="url(#goldGrad)"/>

  <!-- Emerald Turf Blade / Sprout Crossing Center -->
  <path d="M 240,320 
           C 240,260 270,180 320,130 
           C 310,170 290,240 255,290 
           C 265,270 280,240 295,220 
           C 275,250 255,290 250,330 Z" 
        fill="url(#leafGrad)"/>

  <!-- Crown / Star Accent at Apex -->
  <polygon points="250,65 258,82 277,82 262,93 268,110 250,99 232,110 238,93 223,82 242,82" 
           fill="url(#goldGrad)"/>
</svg>
