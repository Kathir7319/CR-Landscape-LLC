<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="fleetSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a90e2"/>
      <stop offset="100%" stop-color="#d4ecff"/>
    </linearGradient>
    <linearGradient id="scagOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7f00"/>
      <stop offset="100%" stop-color="#cc5500"/>
    </linearGradient>
    <linearGradient id="fleetTurf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3cb371"/>
      <stop offset="100%" stop-color="#195430"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="350" fill="url(#fleetSky)"/>

  <!-- Raleigh Commercial Headquarters Trees -->
  <g fill="#163e24">
    <circle cx="150" cy="320" r="70"/>
    <circle cx="280" cy="310" r="80"/>
    <circle cx="950" cy="320" r="75"/>
    <circle cx="1080" cy="310" r="85"/>
  </g>

  <!-- Pristine Turf Lawn -->
  <rect x="0" y="350" width="1200" height="450" fill="url(#fleetTurf)"/>

  <!-- Alternating Precision Lawn Striping -->
  <g opacity="0.3">
    <polygon points="100,350 220,350 350,800 180,800" fill="#78f000"/>
    <polygon points="350,350 480,350 630,800 460,800" fill="#78f000"/>
    <polygon points="620,350 760,350 920,800 740,800" fill="#78f000"/>
    <polygon points="900,350 1040,350 1200,800 1020,800" fill="#78f000"/>
  </g>

  <!-- Commercial Zero-Turn Mower Graphic (Centerpiece) -->
  <g id="commercialMower">
    <!-- Heavy-Duty Rear Drive Wheels -->
    <ellipse cx="440" cy="560" rx="60" ry="70" fill="#1f1f1f"/>
    <ellipse cx="440" cy="560" rx="40" ry="50" fill="#a1a1a1"/>
    <circle cx="440" cy="560" r="16" fill="#1f1f1f"/>

    <ellipse cx="760" cy="560" rx="60" ry="70" fill="#1f1f1f"/>
    <ellipse cx="760" cy="560" rx="40" ry="50" fill="#a1a1a1"/>
    <circle cx="760" cy="560" r="16" fill="#1f1f1f"/>

    <!-- 61-inch Floating Cutting Deck -->
    <rect x="360" y="580" width="480" height="50" rx="15" fill="#2d2d2d" stroke="#ff7f00" stroke-width="5"/>
    <!-- Anti-Scalp Rollers -->
    <ellipse cx="375" cy="625" rx="16" ry="16" fill="#1a1a1a"/>
    <ellipse cx="825" cy="625" rx="16" ry="16" fill="#1a1a1a"/>

    <!-- Main Chassis & Engine Cowling -->
    <polygon points="400,560 480,430 720,430 800,560" fill="url(#scagOrange)"/>
    <rect x="500" y="390" width="200" height="50" rx="10" fill="#1a1a1a"/>

    <!-- High-Back Suspension Operator Seat -->
    <rect x="550" y="360" width="100" height="90" rx="12" fill="#292929"/>
    <rect x="560" y="330" width="80" height="40" rx="8" fill="#1c1c1c"/>

    <!-- Dual Steering Hydro-Gear Levers -->
    <line x1="535" y1="440" x2="520" y2="360" stroke="#f0f0f0" stroke-width="8" stroke-linecap="round"/>
    <line x1="665" y1="440" x2="680" y2="360" stroke="#f0f0f0" stroke-width="8" stroke-linecap="round"/>

    <!-- Front Caster Wheels & Forks -->
    <rect x="420" y="600" width="30" height="30" rx="8" fill="#1f1f1f"/>
    <rect x="750" y="600" width="30" height="30" rx="8" fill="#1f1f1f"/>

    <!-- Commercial Brand Badge on Hood -->
    <rect x="540" y="460" width="120" height="28" rx="6" fill="#111111"/>
    <text x="600" y="478" font-family="sans-serif" font-weight="900" font-size="12" fill="#78f000" text-anchor="middle" letter-spacing="1">CR FLEET</text>
  </g>
</svg>
